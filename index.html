<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bewerbungs-Kanban</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --ink: #16202e;
    --ink-soft: #6b7280;
    --ink-faint: #9ca3af;
    --border: #e5e7eb;
    --header: #111a26;
    --accent: #2f6f5e;

    --red: #c2553d;
    --red-soft: #fdf0ed;
    --yellow: #c98a1e;
    --yellow-soft: #fdf6e7;
    --green: #3f8d68;
    --green-soft: #edf6f1;
    --blue: #3b6ea5;
    --blue-soft: #eef3f9;

    --radius: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 4px 14px rgba(16,24,40,.10);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Topbar ---------- */
  .topbar {
    background: var(--header);
    color: #fff;
    padding: 14px 24px 0;
  }
  .topbar-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .brand .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }

  .topbar-tools { display: flex; align-items: center; gap: 10px; }

  .searchbar { padding: 16px 24px 0; }
  .search-wrap { position: relative; max-width: 340px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--ink-faint); }
  .search-input {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: 9px;
    padding: 9px 30px 9px 32px;
    font-size: 13.5px;
    font-family: inherit;
    width: 100%;
    box-shadow: var(--shadow);
    transition: border-color .15s, box-shadow .15s;
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,111,94,.10); }
  .search-clear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--ink-faint);
    cursor: pointer; font-size: 17px; line-height: 1; padding: 2px 4px; display: none;
  }
  .search-clear.show { display: block; }

  .add-btn {
    background: #fff; color: var(--header); border: none;
    padding: 8px 14px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity .15s;
  }
  .add-btn:hover { opacity: .88; }
  .add-btn:disabled { opacity: .45; cursor: default; }

  .sync-status { font-size: 12px; color: rgba(255,255,255,.6); white-space: nowrap; }

  .tabs { display: flex; gap: 2px; margin-top: 12px; }
  .tab-btn {
    background: none; border: none; color: rgba(255,255,255,.6);
    padding: 9px 14px; font-size: 13px; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
  }
  .tab-btn:hover { color: rgba(255,255,255,.85); }
  .tab-btn.active { color: #fff; border-bottom-color: #fff; }
  .tab-btn .badge {
    background: rgba(255,255,255,.16); border-radius: 999px;
    padding: 1px 7px; font-size: 11px; margin-left: 6px;
  }

  .view { display: none; }
  .view.active { display: block; }

  /* ---------- Board ---------- */
  .board {
    display: grid;
    grid-auto-flow: column;
    grid-auto-columns: minmax(244px, 1fr);
    gap: 12px;
    padding: 18px 24px 32px;
    align-items: start;
    overflow-x: auto;
  }

  .column {
    background: rgba(255,255,255,.55);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-height: 90px;
  }
  .column.dim { opacity: .45; }

  .column-head {
    padding: 11px 13px 9px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px;
  }
  .column-title { font-size: 12px; font-weight: 600; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-soft); }
  .count-pill {
    font-size: 11px; font-weight: 600; color: var(--ink-soft);
    background: #eceef1; padding: 1px 7px; border-radius: 999px;
  }

  .card-list {
    padding: 0 9px 10px;
    display: flex; flex-direction: column; gap: 8px;
    flex: 1; min-height: 44px;
  }
  .card-list.drag-over { background: #e8ebef; border-radius: 8px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 9px;
    padding: 10px 11px;
    cursor: grab;
    box-shadow: var(--shadow);
    transition: box-shadow .15s, transform .1s;
  }
  .card:hover { box-shadow: var(--shadow-lg); transform: translateY(-1px); }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: .35; }

  .card.status-offen { border-left-color: var(--yellow); }
  .card.status-abgelehnt { border-left-color: var(--red); }
  .card.status-angenommen { border-left-color: var(--green); }
  .card.status-talent_pool { border-left-color: var(--blue); }

  .card-org { font-size: 13.5px; font-weight: 600; margin: 0 0 1px; letter-spacing: -.005em; }
  .card-pos { font-size: 12px; color: var(--ink-soft); margin: 0; line-height: 1.35; }
  .card-foot {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 8px; font-size: 11px; color: var(--ink-faint);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 7px; border-radius: 999px; font-size: 10.5px; font-weight: 500;
  }
  .chip-offen { background: var(--yellow-soft); color: var(--yellow); }
  .chip-abgelehnt { background: var(--red-soft); color: var(--red); }
  .chip-angenommen { background: var(--green-soft); color: var(--green); }
  .chip-talent_pool { background: var(--blue-soft); color: var(--blue); }

  mark { background: #fdf0b8; color: inherit; padding: 0 1px; border-radius: 2px; }

  .empty-hint { font-size: 12px; color: var(--ink-faint); text-align: center; padding: 12px 6px; }

  .no-results {
    padding: 40px 24px; text-align: center; color: var(--ink-soft); font-size: 14px;
  }

  /* ---------- Modal ---------- */
  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(16,24,40,.5);
    align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
    backdrop-filter: blur(2px);
  }
  .overlay.open { display: flex; }

  .modal {
    background: var(--surface); border-radius: 14px;
    width: 100%; max-width: 520px; padding: 22px 24px 20px;
    box-shadow: 0 20px 50px rgba(16,24,40,.22);
  }
  .modal h2 { font-size: 16px; font-weight: 600; margin: 0 0 18px; }

  .field { margin-bottom: 13px; }
  .field label {
    display: block; font-size: 11.5px; font-weight: 500;
    color: var(--ink-soft); margin-bottom: 5px;
  }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; font-family: inherit;
    color: var(--ink); background: #fff;
  }
  .field textarea { resize: vertical; min-height: 62px; line-height: 1.45; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(47,111,94,.10);
  }

  .status-row { display: flex; gap: 7px; margin-bottom: 18px; }
  .status-opt {
    flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
    font-size: 12px; font-weight: 500; cursor: pointer;
    border: 1px solid var(--border); color: var(--ink-soft); background: #fff;
    transition: all .12s;
  }
  .status-opt:hover { border-color: var(--ink-faint); }
  .status-opt[data-status="offen"].active { background: var(--yellow-soft); border-color: var(--yellow); color: var(--yellow); font-weight: 600; }
  .status-opt[data-status="abgelehnt"].active { background: var(--red-soft); border-color: var(--red); color: var(--red); font-weight: 600; }
  .status-opt[data-status="angenommen"].active { background: var(--green-soft); border-color: var(--green); color: var(--green); font-weight: 600; }
  .status-opt[data-status="talent_pool"].active { background: var(--blue-soft); border-color: var(--blue); color: var(--blue); font-weight: 600; }
  .status-row { flex-wrap: wrap; }
  .status-opt { min-width: 88px; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }

  .mailverlauf-list {
    border: 1px solid var(--border); border-radius: 8px;
    max-height: 160px; overflow-y: auto; margin-bottom: 8px; background: #fafbfc;
  }
  .mailverlauf-entry {
    padding: 8px 10px; border-bottom: 1px solid var(--border);
    font-size: 12px; display: flex; justify-content: space-between; gap: 10px;
  }
  .mailverlauf-entry:last-child { border-bottom: none; }
  .mailverlauf-date { color: var(--ink-faint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mailverlauf-empty { padding: 14px; font-size: 12px; color: var(--ink-faint); text-align: center; }

  .small-btn {
    background: #fff; border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 11px; font-size: 12px; cursor: pointer; color: var(--ink); font-family: inherit;
  }
  .small-btn:hover { border-color: var(--ink-faint); }

  .modal-actions {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
  }
  .btn {
    padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500;
    cursor: pointer; border: 1px solid var(--border); background: #fff; font-family: inherit;
  }
  .btn:hover { border-color: var(--ink-faint); }
  .btn-primary { background: var(--header); color: #fff; border-color: var(--header); font-weight: 600; }
  .btn-primary:hover { opacity: .9; border-color: var(--header); }
  .btn-primary:disabled { opacity: .5; cursor: default; }
  .btn-danger { background: none; border: none; color: var(--red); font-size: 12.5px; cursor: pointer; font-family: inherit; }
  .btn-danger:hover { text-decoration: underline; }

  .toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--header); color: #fff;
    padding: 9px 18px; border-radius: 9px; font-size: 13px;
    opacity: 0; transition: opacity .2s, transform .2s;
    pointer-events: none; max-width: 90%; text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 720px) {
    .board { grid-auto-flow: row; grid-auto-columns: auto; padding: 16px; }
    .searchbar { padding: 14px 16px 0; }
    .search-wrap { max-width: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <span class="dot"></span>
      <h1>Bewerbungs-Kanban</h1>
    </div>
    <div class="topbar-tools">
      <span class="sync-status" id="syncStatus">Verbinde ...</span>
      <button class="add-btn" id="addBtn" disabled>+ Neu</button>

  </div>
  <div class="tabs">
    <button class="tab-btn active" data-view="bewerbungen">Bewerbungen <span class="badge" id="badgeB">0</span></button>
    <button class="tab-btn" data-view="netzwerk">Netzwerk <span class="badge" id="badgeN">0</span></button>
  </div>
</div>

<div class="view active" id="view-bewerbungen">
  <div class="searchbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search-input" id="searchB" type="text" placeholder="Bewerbungen durchsuchen ..." autocomplete="off">

  </div>
  <div class="board" id="board"></div>
</div>

<div class="view" id="view-netzwerk">
  <div class="searchbar">
    <div class="search-wrap">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input class="search-input" id="searchN" type="text" placeholder="Kontakte durchsuchen ..." autocomplete="off">
      <button class="search-clear" id="clearN" title="Suche löschen">&times;</button>
    </div>
  </div>
  <div class="board" id="contactBoard"></div>
</div>

<!-- Bewerbung Modal -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2 id="modalTitle">Neue Bewerbung</h2>

    <div class="status-row" id="statusRow">
      <div class="status-opt" data-status="offen">Offen</div>
      <div class="status-opt" data-status="abgelehnt">Abgelehnt</div>
      <div class="status-opt" data-status="angenommen">Angenommen</div>

    <div class="field">
      <label for="f-org">Organisation</label>

    <div class="field">
      <label for="f-subtitle">Position</label>

    </div>
    <div class="two-col">
      <div class="field">
        <label for="f-bereich">Bereich</label>
        <select id="f-bereich">
          <option value="Journalismus">Journalismus</option>
          <option value="Wissenschaft">Wissenschaft</option>
          <option value="Start-up">Start-up</option>
          <option value="Gründungszentrum">Gründungszentrum</option>
          <option value="KI">KI</option>
          <option value="Sonstiges">Sonstiges</option>
        </select>
      </div>
      <div class="field">
        <label for="f-datum">Letzter Kontakt</label>
        <input id="f-datum" type="date">
      </div>
    </div>
    <div class="two-col">
      <div class="field">
        <label for="f-person">Ansprechperson</label>
        <input id="f-person" type="text" placeholder="Name">
      </div>
      <div class="field">
        <label for="f-mail">Kontakt E-Mail</label>
        <input id="f-mail" type="email" placeholder="name@beispiel.de">
      </div>
    </div>
    <div class="field">
      <label for="f-link">Stellenlink</label>
      <input id="f-link" type="text" placeholder="https://...">
    </div>

    <div class="field">
      <label>Mailverlauf</label>
      <div class="mailverlauf-list" id="mailverlaufList"></div>
      <button type="button" class="small-btn" id="addMailEntryBtn">+ Eintrag hinzufügen</button>
    </div>

    <div class="field">
      <label for="f-notes">Notizen</label>
      <textarea id="f-notes" placeholder="Freitext-Notizen ..."></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn-danger" id="deleteBtn">Löschen</button>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="cancelBtn">Abbrechen</button>
        <button class="btn btn-primary" id="saveBtn">Speichern</button>
      </div>
    </div>
  </div>
</div>

<!-- Kontakt Modal -->
<div class="overlay" id="contactOverlay">
  <div class="modal">
    <h2 id="contactModalTitle">Neuer Kontakt</h2>
    <div class="two-col">
      <div class="field">
        <label for="c-name">Name</label>
        <input id="c-name" type="text" placeholder="Name">
      </div>
      <div class="field">
        <label for="c-unternehmen">Unternehmen</label>
        <input id="c-unternehmen" type="text" placeholder="Firma/Organisation">
      </div>
    </div>
    <div class="field">
      <label for="c-email">E-Mail</label>
      <input id="c-email" type="email" placeholder="name@beispiel.de">
    </div>
    <div class="field">
      <label for="c-bereich">Bereich</label>
      <select id="c-bereich">
        <option value="Journalismus">Journalismus</option>
        <option value="Wissenschaft">Wissenschaft</option>
        <option value="Start-up">Start-up</option>
        <option value="Gründungszentrum">Gründungszentrum</option>
        <option value="KI">KI</option>
        <option value="Sonstiges">Sonstiges</option>
      </select>
    </div>
    <div class="two-col">
      <div class="field">
        <label for="c-erster">Erster Kontakt</label>
        <input id="c-erster" type="date">
      </div>
      <div class="field">
        <label for="c-letzter">Letzter Kontakt</label>
        <input id="c-letzter" type="date">
      </div>
    </div>
    <div class="field">
      <label for="c-notizen">Notizen</label>
      <textarea id="c-notizen" placeholder="Freitext-Notizen ..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-danger" id="contactDeleteBtn">Löschen</button>
      <div style="display:flex; gap:8px;">
        <button class="btn" id="contactCancelBtn">Abbrechen</button>
        <button class="btn btn-primary" id="contactSaveBtn">Speichern</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://abjhtqkrexqnjjbpfuwv.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiamh0cWtyZXhxbmpqYnBmdXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NjQ5OTAsImV4cCI6MjEwNDU0MDk5MH0.R5OJygrvZ1SOJk6mFlEs9ipQyPl5xz1GJoQ7WZ0m1Ns';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const CATEGORIES = [
  { key: 'Journalismus', label: 'Journalismus' },
  { key: 'Wissenschaft', label: 'Wissenschaft' },
  { key: 'Start-up', label: 'Start-up' },
  { key: 'Gründungszentrum', label: 'Gründungszentrum' },
  { key: 'KI', label: 'KI' },
  { key: 'Sonstiges', label: 'Sonstiges' },
];

const STATUSES = [
  { key: 'offen', label: 'Offen' },
  { key: 'abgelehnt', label: 'Abgelehnt' },
  { key: 'angenommen', label: 'Angenommen' },
  { key: 'talent_pool', label: 'Talent Pool' },
];
const STATUS_LABEL = { offen: 'Offen', abgelehnt: 'Abgelehnt', angenommen: 'Angenommen', talent_pool: 'Talent Pool' };

// Altbestand auf die neuen Werte abbilden
const LEGACY_STATUS = { yellow: 'offen', red: 'abgelehnt', green: 'angenommen' };
const LEGACY_CATEGORY = {
  'Gründung/Gründungszentrum': 'Gründungszentrum',
  'Wissenschaft/Akademisch': 'Wissenschaft',
  'Kurzfristig/Nebenjob': 'Sonstiges',
};

function fmtDate(iso) {
  if (!iso) return '';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? m[3] + '.' + m[2] + '.' + m[1] : iso;
}

let cards = [];
let contacts = [];
let editingCardId = null;
let editingContactId = null;
let currentStatus = 'offen';
let currentMailverlauf = [];
let queryB = '';
let queryN = '';

function uid() { return 'c' + Date.now() + Math.random().toString(16).slice(2, 8); }
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}
function highlight(str, query) {
  const s = str == null ? '' : String(str);
  if (!query) return escapeHtml(s);
  const lower = s.toLowerCase();
  const q = query.toLowerCase();
  let out = '';
  let i = 0;
  while (true) {
    const idx = lower.indexOf(q, i);
    if (idx === -1) { out += escapeHtml(s.slice(i)); break; }
    out += escapeHtml(s.slice(i, idx)) + '<mark>' + escapeHtml(s.slice(idx, idx + q.length)) + '</mark>';
    i = idx + q.length;
  }
  return out;
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
function setSyncStatus(text) { document.getElementById('syncStatus').textContent = text; }

function rowToObj(row) { return { id: row.id, ...row.data }; }
function objToRow(obj) { const { id, ...data } = obj; return { id, data }; }

async function loadAll() {
  setSyncStatus('Verbinde ...');
  const [bRes, kRes] = await Promise.all([
    db.from('bewerbungen').select('id, data'),
    db.from('kontakte').select('id, data'),
  ]);
  if (bRes.error) {
    setSyncStatus('Keine Verbindung');
    showToast('Fehler beim Laden: ' + bRes.error.message);
  } else {
    cards = bRes.data.map(rowToObj);
  }
  if (!kRes.error) contacts = kRes.data.map(rowToObj);
  setSyncStatus('Synchron');
  document.getElementById('addBtn').disabled = false;
  renderAll();
}

function cardCategory(c) {
  const b = c.bereich || 'Sonstiges';
  return LEGACY_CATEGORY[b] || b;
}
function cardStatus(c) {
  const s = c.status || 'offen';
  return LEGACY_STATUS[s] || s;
}
function cardSubtitle(c) { return c.subtitle || c.pos || ''; }
function contactCategory(c) {
  const b = c.bereich || 'Sonstiges';
  return LEGACY_CATEGORY[b] || b;
}

function cardMatches(c) {
  if (!queryB) return true;
  const q = queryB.toLowerCase();
  const hay = [c.org, cardSubtitle(c), c.person, c.mail, c.notes, cardCategory(c), c.link,
    ...(c.mailverlauf || []).map(e => e.betreff)].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}
function contactMatches(c) {
  if (!queryN) return true;
  const q = queryN.toLowerCase();
  const hay = [c.name, c.email, c.unternehmen, c.notizen, contactCategory(c)].filter(Boolean).join(' ').toLowerCase();
  return hay.includes(q);
}

function renderAll() { renderBoard(); renderContacts(); }

function renderBoard() {
  const board = document.getElementById('board');
  const visible = cards.filter(cardMatches);
  document.getElementById('badgeB').textContent = visible.length;
  board.innerHTML = '';

  if (queryB && visible.length === 0) {
    board.innerHTML = '<div class="no-results">Keine Bewerbung passt zu &bdquo;' + escapeHtml(queryB) + '&ldquo;.</div>';
    board.style.display = 'block';
    return;
  }
  board.style.display = '';

  CATEGORIES.forEach(cat => {
    const filtered = visible.filter(c => cardCategory(c) === cat.key);
    const col = document.createElement('div');
    col.className = 'column' + (queryB && filtered.length === 0 ? ' dim' : '');
    col.innerHTML =
      '<div class="column-head"><span class="column-title">' + escapeHtml(cat.label) + '</span>' +
      '<span class="count-pill">' + filtered.length + '</span></div>' +
      '<div class="card-list" data-bereich="' + escapeHtml(cat.key) + '"></div>';
    board.appendChild(col);
    const list = col.querySelector('.card-list');

    if (filtered.length === 0) {
      const h = document.createElement('div');
      h.className = 'empty-hint';
      h.textContent = queryB ? '—' : 'Keine Einträge';
      list.appendChild(h);
    }

    filtered.forEach(card => {
      const el = document.createElement('div');
      el.className = 'card status-' + cardStatus(card);
      el.draggable = true;
      el.dataset.id = card.id;
      const mv = (card.mailverlauf || []).length;
      const st = cardStatus(card);
      el.innerHTML =
        '<p class="card-org">' + highlight(card.org || 'Ohne Namen', queryB) + '</p>' +
        (cardSubtitle(card) ? '<p class="card-pos">' + highlight(cardSubtitle(card), queryB) + '</p>' : '') +
        '<div class="card-foot">' +
        '<span class="chip chip-' + st + '">' + STATUS_LABEL[st] + '</span>' +
        (card.person ? '<span>' + highlight(card.person, queryB) + '</span>' : '') +
        (mv ? '<span>' + mv + ' Mail' + (mv > 1 ? 's' : '') + '</span>' : '') +
        (card.datum ? '<span>' + escapeHtml(fmtDate(card.datum)) + '</span>' : '') +
        '</div>';
      el.addEventListener('click', () => openCardModal(card.id));
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      list.appendChild(el);
    });
  });

  board.querySelectorAll('.card-list').forEach(list => {
    list.addEventListener('dragover', e => { e.preventDefault(); list.classList.add('drag-over'); });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', async e => {
      e.preventDefault();
      list.classList.remove('drag-over');
      const dragging = document.querySelector('.card.dragging');
      if (!dragging) return;
      const card = cards.find(c => c.id === dragging.dataset.id);
      const nb = list.dataset.bereich;
      if (card && cardCategory(card) !== nb) {
        card.bereich = nb;
        renderBoard();
        const { error } = await db.from('bewerbungen').update({ data: objToRow(card).data }).eq('id', card.id);
        if (error) showToast('Speichern fehlgeschlagen: ' + error.message);
      }
    });
  });
}

function renderContacts() {
  const board = document.getElementById('contactBoard');
  const visible = contacts.filter(contactMatches);
  document.getElementById('badgeN').textContent = visible.length;
  board.innerHTML = '';

  if (queryN && visible.length === 0) {
    board.innerHTML = '<div class="no-results">Kein Kontakt passt zu &bdquo;' + escapeHtml(queryN) + '&ldquo;.</div>';
    board.style.display = 'block';
    return;
  }
  board.style.display = '';

  CATEGORIES.forEach(cat => {
    const filtered = visible.filter(c => contactCategory(c) === cat.key);
    const col = document.createElement('div');
    col.className = 'column' + (queryN && filtered.length === 0 ? ' dim' : '');
    col.innerHTML =
      '<div class="column-head"><span class="column-title">' + escapeHtml(cat.label) + '</span>' +
      '<span class="count-pill">' + filtered.length + '</span></div>' +
      '<div class="card-list contact-list" data-bereich="' + escapeHtml(cat.key) + '"></div>';
    board.appendChild(col);
    const list = col.querySelector('.card-list');

    if (filtered.length === 0) {
      const h = document.createElement('div');
      h.className = 'empty-hint';
      h.textContent = queryN ? '—' : 'Keine Kontakte';
      list.appendChild(h);
    }

    filtered.forEach(contact => {
      const el = document.createElement('div');
      el.className = 'card contact-item';
      el.draggable = true;
      el.dataset.id = contact.id;
      el.innerHTML =
        '<p class="card-org">' + highlight(contact.name || contact.email || 'Unbekannt', queryN) + '</p>' +
        (contact.unternehmen ? '<p class="card-pos">' + highlight(contact.unternehmen, queryN) + '</p>' : '') +
        '<div class="card-foot">' +
        (contact.email ? '<span>' + highlight(contact.email, queryN) + '</span>' : '') +
        (contact.letzter_kontakt ? '<span>' + escapeHtml(fmtDate(contact.letzter_kontakt)) + '</span>' : '') +
        '</div>';
      el.addEventListener('click', () => openContactModal(contact.id));
      el.addEventListener('dragstart', () => el.classList.add('dragging'));
      el.addEventListener('dragend', () => el.classList.remove('dragging'));
      list.appendChild(el);
    });
  });

  board.querySelectorAll('.contact-list').forEach(list => {
    list.addEventListener('dragover', e => { e.preventDefault(); list.classList.add('drag-over'); });
    list.addEventListener('dragleave', () => list.classList.remove('drag-over'));
    list.addEventListener('drop', async e => {
      e.preventDefault();
      list.classList.remove('drag-over');
      const dragging = document.querySelector('.contact-item.dragging');
      if (!dragging) return;
      const contact = contacts.find(c => c.id === dragging.dataset.id);
      const nb = list.dataset.bereich;
      if (contact && contactCategory(contact) !== nb) {
        contact.bereich = nb;
        renderContacts();
        const { error } = await db.from('kontakte').update({ data: objToRow(contact).data }).eq('id', contact.id);
        if (error) showToast('Speichern fehlgeschlagen: ' + error.message);
      }
    });
  });
}

/* Suche - je Tab ein eigenes Feld */
const searchB = document.getElementById('searchB');
const clearB = document.getElementById('clearB');
const searchN = document.getElementById('searchN');
const clearN = document.getElementById('clearN');

searchB.addEventListener('input', () => {
  queryB = searchB.value.trim();
  clearB.classList.toggle('show', queryB.length > 0);
  renderBoard();
});
clearB.addEventListener('click', () => {
  searchB.value = ''; queryB = '';
  clearB.classList.remove('show');
  renderBoard(); searchB.focus();
});
searchN.addEventListener('input', () => {
  queryN = searchN.value.trim();
  clearN.classList.toggle('show', queryN.length > 0);
  renderContacts();
});
clearN.addEventListener('click', () => {
  searchN.value = ''; queryN = '';
  clearN.classList.remove('show');
  renderContacts(); searchN.focus();
});
function activeSearch() {
  return document.getElementById('view-netzwerk').classList.contains('active') ? searchN : searchB;
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); const s = activeSearch(); s.focus(); s.select(); }
  if (e.key === 'Escape') {
    if (document.activeElement === searchB) { clearB.click(); searchB.blur(); }
    if (document.activeElement === searchN) { clearN.click(); searchN.blur(); }
  }
});

/* Tabs */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    document.getElementById('addBtn').textContent = btn.dataset.view === 'netzwerk' ? '+ Kontakt' : '+ Bewerbung';
  });
});

/* Bewerbung Modal */
function openCardModal(id) {
  editingCardId = id || null;
  const card = id ? cards.find(c => c.id === id) : null;
  document.getElementById('modalTitle').textContent = card ? 'Bewerbung bearbeiten' : 'Neue Bewerbung';
  document.getElementById('f-org').value = card ? (card.org || '') : '';
  document.getElementById('f-subtitle').value = card ? cardSubtitle(card) : '';
  document.getElementById('f-bereich').value = card ? cardCategory(card) : 'Sonstiges';
  document.getElementById('f-datum').value = card ? (card.datum || '') : '';
  document.getElementById('f-person').value = card ? (card.person || '') : '';
  document.getElementById('f-mail').value = card ? (card.mail || '') : '';
  document.getElementById('f-link').value = card ? (card.link || '') : '';
  document.getElementById('f-notes').value = card ? (card.notes || '') : '';
  currentStatus = card ? cardStatus(card) : 'offen';
  currentMailverlauf = card && Array.isArray(card.mailverlauf) ? [...card.mailverlauf] : [];
  updateStatusRow();
  renderMailverlauf();
  document.getElementById('deleteBtn').style.display = card ? 'inline-block' : 'none';
  document.getElementById('overlay').classList.add('open');
}
function closeCardModal() {
  document.getElementById('overlay').classList.remove('open');
  editingCardId = null;
}
function updateStatusRow() {
  document.querySelectorAll('#statusRow .status-opt').forEach(o => {
    o.classList.toggle('active', o.dataset.status === currentStatus);
  });
}
document.querySelectorAll('#statusRow .status-opt').forEach(o => {
  o.addEventListener('click', () => { currentStatus = o.dataset.status; updateStatusRow(); });
});

function renderMailverlauf() {
  const list = document.getElementById('mailverlaufList');
  list.innerHTML = '';
  if (currentMailverlauf.length === 0) {
    list.innerHTML = '<div class="mailverlauf-empty">Noch keine Einträge</div>';
    return;
  }
  currentMailverlauf.slice().reverse().forEach(entry => {
    const row = document.createElement('div');
    row.className = 'mailverlauf-entry';
    row.innerHTML =
      '<span>' + (entry.richtung === 'eingehend' ? '&#8592; ' : entry.richtung === 'ausgehend' ? '&#8594; ' : '') + escapeHtml(entry.betreff || entry.zusammenfassung || '') + '</span>' +
      '<span class="mailverlauf-date">' + escapeHtml(fmtDate(entry.datum)) + '</span>';
    list.appendChild(row);
  });
}
document.getElementById('addMailEntryBtn').addEventListener('click', () => {
  const betreff = prompt('Kurze Notiz zu diesem Kontakt:');
  if (betreff === null || betreff.trim() === '') return;
  currentMailverlauf.push({ datum: new Date().toISOString().slice(0, 10), betreff: betreff.trim() });
  renderMailverlauf();
});

document.getElementById('addBtn').addEventListener('click', () => {
  const n = document.getElementById('view-netzwerk').classList.contains('active');
  if (n) openContactModal(null); else openCardModal(null);
});
document.getElementById('cancelBtn').addEventListener('click', closeCardModal);
document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeCardModal(); });

document.getElementById('saveBtn').addEventListener('click', async () => {
  const org = document.getElementById('f-org').value.trim();
  if (!org) {
    document.getElementById('f-org').style.borderColor = '#c2553d';
    showToast('Bitte Organisation eintragen');
    return;
  }
  document.getElementById('f-org').style.borderColor = '';
  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;

  const data = {
    org,
    subtitle: document.getElementById('f-subtitle').value.trim(),
    bereich: document.getElementById('f-bereich').value,
    datum: document.getElementById('f-datum').value,
    person: document.getElementById('f-person').value.trim(),
    mail: document.getElementById('f-mail').value.trim(),
    link: document.getElementById('f-link').value.trim(),
    notes: document.getElementById('f-notes').value.trim(),
    status: currentStatus,
    mailverlauf: currentMailverlauf,
  };

  let card;
  if (editingCardId) {
    const i = cards.findIndex(c => c.id === editingCardId);
    card = { ...cards[i], ...data };
    cards[i] = card;
  } else {
    card = { id: uid(), ...data };
    cards.push(card);
  }

  const { error } = await db.from('bewerbungen').upsert(objToRow(card));
  saveBtn.disabled = false;
  if (error) { showToast('Speichern fehlgeschlagen: ' + error.message); return; }
  renderBoard();
  closeCardModal();
  showToast('Gespeichert');
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if (!editingCardId) return;
  const id = editingCardId;
  const { error } = await db.from('bewerbungen').delete().eq('id', id);
  if (error) { showToast('Löschen fehlgeschlagen: ' + error.message); return; }
  cards = cards.filter(c => c.id !== id);
  renderBoard();
  closeCardModal();
  showToast('Gelöscht');
});

/* Kontakt Modal */
function openContactModal(id) {
  editingContactId = id || null;
  const c = id ? contacts.find(x => x.id === id) : null;
  document.getElementById('contactModalTitle').textContent = c ? 'Kontakt bearbeiten' : 'Neuer Kontakt';
  document.getElementById('c-name').value = c ? (c.name || '') : '';
  document.getElementById('c-email').value = c ? (c.email || '') : '';
  document.getElementById('c-unternehmen').value = c ? (c.unternehmen || '') : '';
  document.getElementById('c-bereich').value = c ? contactCategory(c) : 'Sonstiges';
  document.getElementById('c-erster').value = c ? (c.erster_kontakt || '') : '';
  document.getElementById('c-letzter').value = c ? (c.letzter_kontakt || '') : '';
  document.getElementById('c-notizen').value = c ? (c.notizen || '') : '';
  document.getElementById('contactDeleteBtn').style.display = c ? 'inline-block' : 'none';
  document.getElementById('contactOverlay').classList.add('open');
}
function closeContactModal() {
  document.getElementById('contactOverlay').classList.remove('open');
  editingContactId = null;
}
document.getElementById('contactCancelBtn').addEventListener('click', closeContactModal);
document.getElementById('contactOverlay').addEventListener('click', e => { if (e.target.id === 'contactOverlay') closeContactModal(); });

document.getElementById('contactSaveBtn').addEventListener('click', async () => {
  const name = document.getElementById('c-name').value.trim();
  if (!name) {
    document.getElementById('c-name').style.borderColor = '#c2553d';
    showToast('Bitte Namen eintragen');
    return;
  }
  document.getElementById('c-name').style.borderColor = '';
  const btn = document.getElementById('contactSaveBtn');
  btn.disabled = true;

  const data = {
    name,
    email: document.getElementById('c-email').value.trim(),
    unternehmen: document.getElementById('c-unternehmen').value.trim(),
    bereich: document.getElementById('c-bereich').value,
    erster_kontakt: document.getElementById('c-erster').value,
    letzter_kontakt: document.getElementById('c-letzter').value,
    notizen: document.getElementById('c-notizen').value.trim(),
  };

  let contact;
  if (editingContactId) {
    const i = contacts.findIndex(x => x.id === editingContactId);
    contact = { ...contacts[i], ...data };
    contacts[i] = contact;
  } else {
    contact = { id: uid(), ...data };
    contacts.push(contact);
  }

  const { error } = await db.from('kontakte').upsert(objToRow(contact));
  btn.disabled = false;
  if (error) { showToast('Speichern fehlgeschlagen: ' + error.message); return; }
  renderContacts();
  closeContactModal();
  showToast('Gespeichert');
});

document.getElementById('contactDeleteBtn').addEventListener('click', async () => {
  if (!editingContactId) return;
  const id = editingContactId;
  const { error } = await db.from('kontakte').delete().eq('id', id);
  if (error) { showToast('Löschen fehlgeschlagen: ' + error.message); return; }
  contacts = contacts.filter(c => c.id !== id);
  renderContacts();
  closeContactModal();
  showToast('Gelöscht');
});

loadAll();
</script>
